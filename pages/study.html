<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study | Lee-seungmihn</title>
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/font.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/util.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ── Study Layout ── */
        body { overflow: hidden; height: 100%; }

        .study-wrap {
            display: flex;
            height: 100vh;
            margin-left: 0;
        }

        /* Left panel – topic list */
        .topic-panel {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            overflow-y: auto;
            background: #1e1e1e;
            border-right: 1px solid var(--border-color);
            padding: 24px 0;
            flex-shrink: 0;
        }
        .topic-panel-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .topic-panel-header .cat-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .topic-panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }
        .topic-list { list-style: none; }
        .topic-list li a {
            display: block;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .topic-list li a:hover {
            color: var(--accent-color);
            background: rgba(255,239,192,0.05);
        }
        .topic-list li a.active {
            color: var(--accent-color);
            background: rgba(255,239,192,0.08);
            border-left-color: var(--accent-color);
            font-weight: 600;
        }
        .topic-list li .topic-num {
            display: inline-block;
            width: 22px;
            font-size: 11px;
            color: #555;
            margin-right: 4px;
        }

        /* Right panel – content viewer */
        .content-panel {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 60px;
            background: var(--primary-bg);
        }

        .content-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent-color); }
        .breadcrumb span { margin: 0 6px; }
        .content-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* ── Note Content ── */
        .note-body {
            line-height: 1.9;
            font-size: 15px;
            max-width: 860px;
        }

        /* Section divider */
        .note-body .n-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 32px 0;
        }

        /* Headings */
        .note-body h3 {
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 32px 0 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,239,192,0.15);
        }
        .note-body h3:first-child { margin-top: 0; }
        .note-body h4 {
            font-size: 15px;
            font-weight: 600;
            color: #c0c0c0;
            margin: 20px 0 6px;
            padding-left: 10px;
            border-left: 2px solid rgba(255,239,192,0.25);
        }

        /* Body paragraph */
        .note-body p {
            color: #c8c8c8;
            margin: 5px 0;
            padding-left: 4px;
        }

        /* ── Code Block ── */
        .code-wrap {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin: 14px 0 20px;
            overflow: hidden;
        }
        .code-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 6px 14px;
        }
        .code-bar .code-dots {
            display: flex; gap: 6px;
        }
        .code-dots span {
            width: 11px; height: 11px;
            border-radius: 50%;
        }
        .code-dots span:nth-child(1) { background: #ff5f57; }
        .code-dots span:nth-child(2) { background: #febc2e; }
        .code-dots span:nth-child(3) { background: #28c840; }
        .code-bar .copy-btn {
            background: none;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .code-bar .copy-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .code-wrap pre {
            margin: 0;
            padding: 18px 20px;
            overflow-x: auto;
            font-family: 'Consolas', 'D2Coding', 'Fira Code', monospace;
            font-size: 13.5px;
            line-height: 1.7;
            color: #e6edf3;
            background: none;
            border: none;
        }

        /* ── Callouts ── */
        .note-body .n-callout {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(255,239,192,0.05);
            border: 1px solid rgba(255,239,192,0.18);
            border-radius: 7px;
            padding: 11px 15px;
            margin: 12px 0;
            color: #d6c88a;
            font-size: 14px;
            line-height: 1.7;
        }
        .note-body .n-callout .icon { font-size: 15px; margin-top: 2px; flex-shrink: 0; }
        .note-body .n-sub-callout {
            background: rgba(255,239,192,0.03);
            border-left: 2px solid rgba(255,239,192,0.25);
            padding: 6px 12px;
            margin: 6px 0 6px 16px;
            color: #b8a870;
            font-size: 14px;
        }
        .note-body .n-tip {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(82,154,213,0.07);
            border-left: 3px solid #4d90c8;
            border-radius: 0 6px 6px 0;
            padding: 10px 14px;
            margin: 10px 0;
            color: #88b8d8;
            font-size: 14px;
            line-height: 1.7;
        }
        .note-body .n-tip .icon { flex-shrink: 0; margin-top: 2px; }
        .note-body .n-practice {
            background: rgba(100,200,130,0.05);
            border: 1px solid rgba(100,200,130,0.2);
            border-radius: 7px;
            padding: 12px 16px;
            margin: 14px 0;
            color: #90d8a8;
            font-size: 14px;
        }
        .note-body .n-practice::before {
            content: "🧪 실습";
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #6ec68a;
        }

        /* ── Section Labels (구조화 마커용) ── */
        .sec-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 28px 0 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .sec-label .sec-icon { font-size: 14px; }

        /* 출력 블록 — 터미널 스타일 */
        .output-wrap {
            background: #0a0a0a;
            border: 1px solid #252525;
            border-radius: 8px;
            margin: 0 0 20px;
            overflow: hidden;
        }
        .output-bar {
            background: #111;
            border-bottom: 1px solid #252525;
            padding: 6px 14px;
            font-size: 12px;
            color: #555;
            font-family: monospace;
        }
        .output-wrap pre {
            margin: 0;
            padding: 16px 20px;
            font-family: 'Consolas', 'D2Coding', monospace;
            font-size: 13.5px;
            line-height: 1.7;
            color: #4ec94e;
            background: none;
        }

        /* 코드설명 블록 */
        .explanation-wrap {
            background: rgba(255,239,192,0.03);
            border-left: 3px solid rgba(255,239,192,0.3);
            border-radius: 0 6px 6px 0;
            padding: 14px 18px;
            margin: 0 0 20px;
        }
        .explanation-wrap p {
            padding-left: 0 !important;
            margin: 4px 0;
        }

        /* topic-list 구분선 + 메모 항목 */
        .topic-list .topic-divider {
            height: 1px;
            background: var(--border-color);
            margin: 10px 0;
        }
        .topic-list .memo-link {
            color: #666 !important;
            font-size: 13px;
        }
        .topic-list .memo-link:hover { color: #aaa !important; }
        .topic-list .memo-link.active { color: var(--text-muted) !important; border-left-color: #666 !important; }

        /* 메모 모드 - raw 노트 스타일 */
        .memo-raw {
            font-family: 'Consolas', 'D2Coding', monospace;
            font-size: 13px;
            line-height: 1.85;
            color: #888;
            white-space: pre-wrap;
            word-break: break-word;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px 28px;
        }

        /* Loading / Empty state */
        .state-msg {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-size: 15px;
        }
        .state-msg i { font-size: 40px; display: block; margin-bottom: 16px; opacity: 0.4; }

        /* Mobile */
        @media (max-width: 768px) {
            .topic-panel { width: 200px; min-width: 200px; }
            .content-panel { padding: 24px 20px; }
            .content-header h1 { font-size: 20px; }
            .note-body { font-size: 14px; }
        }
        @media (max-width: 600px) {
            .topic-panel {
                position: fixed;
                top: 0; left: -220px;
                width: 220px;
                z-index: 200;
                transition: left 0.3s ease;
                box-shadow: 4px 0 20px rgba(0,0,0,0.5);
            }
            .topic-panel.open { left: 0; }
            .study-wrap { flex-direction: column; }
            .content-panel { height: 100vh; }
            .topic-toggle {
                display: flex !important;
                position: fixed;
                bottom: 70px;
                right: 20px;
                z-index: 201;
                width: 48px; height: 48px;
                background: var(--accent-color);
                color: var(--primary-bg);
                border: none;
                border-radius: 50%;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            }
        }
        .topic-toggle { display: none; }
    </style>
</head>
<body>

    <!-- Study 2-panel layout -->
    <div class="study-wrap">

        <!-- Left: Topic panel -->
        <aside class="topic-panel hide-scrollbar" id="topicPanel">
            <div class="topic-panel-header">
                <div class="cat-icon" id="catIcon"></div>
                <h2 id="catTitle">Loading...</h2>
            </div>
            <ul class="topic-list" id="topicList"></ul>
        </aside>

        <!-- Right: Content panel -->
        <main class="content-panel hide-scrollbar" id="contentPanel">
            <div class="content-header">
                <div class="breadcrumb">
                    <a href="../index.html">Home</a>
                    <span>›</span>
                    <a href="materials.html">Materials</a>
                    <span>›</span>
                    <span id="bcCat">-</span>
                </div>
                <h1 id="contentTitle">토픽을 선택해주세요</h1>
            </div>
            <div class="note-body" id="noteBody">
                <div class="state-msg">
                    <i class="fas fa-hand-point-left"></i>
                    왼쪽에서 학습할 주제를 선택하세요.
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile topic panel toggle -->
    <button class="topic-toggle" id="topicToggle" title="목록 열기">
        <i class="fas fa-list"></i>
    </button>

    <script>
    (() => {
        const params   = new URLSearchParams(location.search);
        const cat      = params.get('cat') || 'java';
        const topicId  = params.get('topic');
        const BASE     = '../assets/data/';

        let manifest = null;
        let catMeta  = null;

        // ── 1. Load manifest ──────────────────────────────────────
        fetch(BASE + 'manifest.json')
            .then(r => r.json())
            .then(data => {
                manifest = data;
                catMeta  = manifest[cat];
                if (!catMeta) { showError('카테고리를 찾을 수 없습니다.'); return; }
                initPanel();
            })
            .catch(() => showError('데이터를 불러올 수 없습니다.'));

        // ── 2. Build topic panel ──────────────────────────────────
        function initPanel() {
            document.title = `${catMeta.title} | Lee-seungmihn`;
            document.getElementById('catIcon').innerHTML = `<i class="${catMeta.icon}" style="color:${catMeta.color}"></i>`;
            document.getElementById('catTitle').textContent = catMeta.title;
            document.getElementById('bcCat').textContent   = catMeta.title;

            if (catMeta.type === 'multi') {
                buildMultiTopics();
            } else {
                buildSingleTopic();
            }
        }

        // Multi-file: one file per topic
        function buildMultiTopics() {
            const ul = document.getElementById('topicList');
            let currentId = null;

            catMeta.topics.forEach((topic, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" data-id="${topic.id}" data-title="${topic.title}">
                    <span class="topic-num">${String(idx + 1).padStart(2, '0')}</span>${topic.title}
                </a>`;
                ul.appendChild(li);
            });

            // ── 메모 구분선 + 항목
            addMemoSeparator(ul);
            const memoLi = document.createElement('li');
            memoLi.innerHTML = `<a href="#" class="memo-link" data-memo="multi">
                <span class="topic-num">📋</span>메모 노트
            </a>`;
            ul.appendChild(memoLi);

            ul.addEventListener('click', e => {
                const a = e.target.closest('a');
                if (!a) return;
                e.preventDefault();
                setActive(a);

                if (a.dataset.memo === 'multi') {
                    // 현재 선택된 파일의 메모 보기
                    if (currentId) {
                        document.getElementById('contentTitle').textContent = '메모 노트';
                        showLoading();
                        fetch(`${BASE}${cat}/${currentId}.txt`)
                            .then(r => r.text())
                            .then(txt => renderMemo(txt))
                            .catch(() => showError('파일을 불러올 수 없습니다.'));
                    } else {
                        document.getElementById('noteBody').innerHTML =
                            '<div class="state-msg"><i class="fas fa-hand-point-left"></i>먼저 토픽을 선택해주세요.</div>';
                    }
                } else if (a.dataset.id) {
                    currentId = a.dataset.id;
                    loadMultiFile(a.dataset.id, a.dataset.title);
                }
            });

            // Auto-select first
            const firstTarget = topicId
                ? ul.querySelector(`a[data-id="${topicId}"]`)
                : ul.querySelector('a[data-id]');
            if (firstTarget) {
                currentId = firstTarget.dataset.id;
                setActive(firstTarget);
                loadMultiFile(firstTarget.dataset.id, firstTarget.dataset.title);
            }
        }

        function loadMultiFile(id, title) {
            document.getElementById('contentTitle').textContent = title;
            showLoading();
            fetch(`${BASE}${cat}/${id}.txt`)
                .then(r => r.text())
                .then(txt => renderNote(txt))
                .catch(() => showError('파일을 불러올 수 없습니다.'));
        }

        // Single-file: parse sections from one txt, build topic list
        function buildSingleTopic() {
            showLoading();
            fetch(BASE + catMeta.file)
                .then(r => r.text())
                .then(fullTxt => {
                    const sections = splitSections(fullTxt);
                    const ul = document.getElementById('topicList');

                    sections.forEach((sec, idx) => {
                        const heading = extractHeading(sec) || `섹션 ${idx + 1}`;
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="#" data-idx="${idx}" data-title="${escHtml(heading)}">
                            <span class="topic-num">${String(idx + 1).padStart(2, '0')}</span>${escHtml(heading)}
                        </a>`;
                        ul.appendChild(li);
                    });

                    // ── 메모 구분선 + 항목
                    addMemoSeparator(ul);
                    const memoLi = document.createElement('li');
                    memoLi.innerHTML = `<a href="#" class="memo-link" data-memo="single">
                        <span class="topic-num">📋</span>메모 전체
                    </a>`;
                    ul.appendChild(memoLi);

                    ul.addEventListener('click', e => {
                        const a = e.target.closest('a');
                        if (!a) return;
                        e.preventDefault();
                        setActive(a);

                        if (a.dataset.memo === 'single') {
                            document.getElementById('contentTitle').textContent = '메모 전체';
                            renderMemo(fullTxt);
                        } else if (a.dataset.idx !== undefined) {
                            document.getElementById('contentTitle').textContent = a.dataset.title;
                            renderNote(sections[+a.dataset.idx]);
                        }
                    });

                    // Auto-select first
                    const first = ul.querySelector('a[data-idx]');
                    if (first) {
                        setActive(first);
                        document.getElementById('contentTitle').textContent = first.dataset.title;
                        renderNote(sections[0]);
                    }
                })
                .catch(() => showError('파일을 불러올 수 없습니다.'));
        }

        function addMemoSeparator(ul) {
            const div = document.createElement('li');
            div.innerHTML = '<div class="topic-divider"></div>';
            ul.appendChild(div);
        }

        // ── 3. txt → HTML renderer ────────────────────────────────

        // 메모 노트: raw 텍스트 그대로 보여주기
        function renderMemo(txt) {
            document.getElementById('noteBody').innerHTML =
                `<div class="memo-raw">${escHtml(txt)}</div>`;
            document.getElementById('contentPanel').scrollTop = 0;
        }

        let _codeId = 0;

        function renderNote(rawText) {
            const lines = rawText.split(/\r?\n/);
            let html = '';
            let codeLines = [];
            let inCode = false;
            // 섹션(구분선) 이후 첫 번째 비들여쓰기 줄만 h3, 이후는 h4
            let sectionTitleUsed = false;

            // ── helpers ──────────────────────────────────────────────
            const indentOf = raw => {
                const t = (raw.match(/^\t+/) || [''])[0].length;
                const s = (raw.match(/^ +/)  || [''])[0].length;
                return t || Math.floor(s / 4);
            };

            // 한국어(완성형) 포함 여부
            const hasKorean = str => /[가-힯]/.test(str);

            // 특수 마커 줄인지 (▶▷※ 등은 절대 코드 아님)
            const isMarker = t =>
                t.startsWith('▶') || t.startsWith('▷') || t.startsWith('※') ||
                t.startsWith('★') || /^\[.{1,10}\]$/.test(t);

            const isCodeLine = (raw, trimmed) => {
                if (!trimmed) return false;
                if (/^[-=─]{5,}/.test(trimmed)) return false;
                if (isMarker(trimmed)) return false;         // 마커는 무조건 코드 아님
                if (hasKorean(trimmed)) return false;        // 한국어 포함 줄은 코드 아님

                const ind = indentOf(raw);
                return (
                    /[{};]$/.test(trimmed) ||                // 코드 종료 문자
                    /[{}]/.test(trimmed) && ind >= 1 ||      // 중괄호 포함 + 들여쓰기
                    /^(public|private|protected|static |abstract |final |class |interface |enum |void |int |long |short |double |float |char |boolean |String |byte |return |if\s*\(|else\s*[\{$]|else if|for\s*\(|while\s*\(|do\s*\{|switch\s*\(|case |default\s*:|import |package |new |try\s*[\{$]|catch\s*\(|finally\s*[\{$]|@Override|@FunctionalInterface|@Getter|@Setter|@Service|@Repository|@Controller|@RestController|@Entity|@Table|@Column|@Id|System\.|\\/\\/|\\/\\*|\\* )/.test(trimmed) ||
                    // 순수 HTML 태그 (한국어 없음은 위에서 확인)
                    /^<[a-zA-Z!/?]/.test(trimmed) && />/.test(trimmed) && ind >= 1 ||
                    // 변수/메서드 선언 패턴 (한국어 없음 보장됨)
                    /^[A-Za-z$_][\w$<>\[\]., ]*\s+[a-z$_][\w$]*\s*[=;(]/.test(trimmed) && ind >= 1
                );
            };

            const flushCode = () => {
                if (!codeLines.length) { inCode = false; return; }
                while (codeLines.length && !codeLines[codeLines.length - 1].trim()) codeLines.pop();
                if (!codeLines.length) { inCode = false; return; }
                const id = 'cb' + (++_codeId);
                html += `<div class="code-wrap"><div class="code-bar"><div class="code-dots"><span></span><span></span><span></span></div><button class="copy-btn" onclick="copyCode('${id}')"><i class="fas fa-copy"></i> 복사</button></div><pre id="${id}">${escHtml(codeLines.join('\n'))}</pre></div>`;
                codeLines = [];
                inCode = false;
            };

            // ── main loop ────────────────────────────────────────────
            for (const raw of lines) {
                const trimmed = raw.trim();

                // 구분선 → 섹션 리셋
                if (/^[-=─]{5,}\s*$/.test(trimmed)) {
                    flushCode();
                    html += '<hr class="n-divider">';
                    sectionTitleUsed = false;
                    continue;
                }

                // 빈 줄: 코드 중이면 블록에 포함
                if (!trimmed) {
                    if (inCode) codeLines.push('');
                    continue;
                }

                // 코드 줄 감지
                if (isCodeLine(raw, trimmed)) {
                    inCode = true;
                    codeLines.push(raw.replace(/\t/g, '    '));
                    continue;
                }

                // 여기까지 왔으면 반드시 코드 아님 → flush
                flushCode();

                const indent = indentOf(raw);

                // ▶ 큰 마커
                if (trimmed.startsWith('▶')) {
                    html += `<div class="n-callout"><span class="icon">▶</span><span>${escHtml(trimmed.slice(1).trim())}</span></div>`;
                    continue;
                }
                // ▷ 작은 마커
                if (trimmed.startsWith('▷')) {
                    html += `<div class="n-sub-callout">${escHtml(trimmed.slice(1).trim())}</div>`;
                    continue;
                }
                // ※ 참고
                if (trimmed.startsWith('※')) {
                    html += `<div class="n-tip"><span class="icon">💡</span><span>${escHtml(trimmed.slice(1).trim())}</span></div>`;
                    continue;
                }
                // [실습] 등 대괄호 마커
                if (/^\[.{1,10}\]/.test(trimmed)) {
                    html += `<div class="n-practice">${escHtml(trimmed)}</div>`;
                    continue;
                }

                // 제목 계층:
                //   - 들여쓰기 없고 짧으면 → 섹션 내 첫 번째만 h3, 이후는 h4
                //   - 들여쓰기 1단 + 숫자 목록 → h4
                if (indent === 0 && trimmed.length < 70) {
                    if (!sectionTitleUsed) {
                        html += `<h3>${escHtml(trimmed)}</h3>`;
                        sectionTitleUsed = true;
                    } else {
                        html += `<h4>${escHtml(trimmed)}</h4>`;
                    }
                    continue;
                }

                if (/^\d+[\.)]/.test(trimmed) && indent <= 1 && trimmed.length < 80) {
                    html += `<h4>${escHtml(trimmed)}</h4>`;
                    continue;
                }

                // 일반 단락
                html += `<p>${escHtml(trimmed)}</p>`;
            }

            flushCode();
            document.getElementById('noteBody').innerHTML =
                html || '<p style="color:var(--text-muted)">내용이 없습니다.</p>';
            document.getElementById('contentPanel').scrollTop = 0;
        }

        // ── 4. Helpers ────────────────────────────────────────────
        function splitSections(txt) {
            return txt.split(/\n[-=]{5,}\s*\n/).map(s => s.trim()).filter(Boolean);
        }

        function extractHeading(section) {
            const lines = section.split(/\r?\n/);
            for (const l of lines) {
                const t = l.trim();
                if (t && !/^[-=]/.test(t)) return t.substring(0, 40);
            }
            return null;
        }

        function setActive(el) {
            document.querySelectorAll('.topic-list a').forEach(a => a.classList.remove('active'));
            el.classList.add('active');
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function showLoading() {
            document.getElementById('noteBody').innerHTML =
                '<div class="state-msg"><i class="fas fa-spinner fa-spin"></i>불러오는 중...</div>';
        }

        function showError(msg) {
            document.getElementById('noteBody').innerHTML =
                `<div class="state-msg"><i class="fas fa-exclamation-triangle"></i>${msg}</div>`;
        }

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // Copy code to clipboard
        window.copyCode = (id) => {
            const pre = document.getElementById(id);
            if (!pre) return;
            navigator.clipboard.writeText(pre.textContent).then(() => {
                const btn = pre.closest('.code-wrap').querySelector('.copy-btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> 복사됨';
                btn.style.color = 'var(--accent-color)';
                setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; }, 1800);
            });
        };

        // Mobile topic panel toggle
        const toggleBtn = document.getElementById('topicToggle');
        const panel     = document.getElementById('topicPanel');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('open');
            });
            document.getElementById('contentPanel').addEventListener('click', () => {
                panel.classList.remove('open');
            });
        }
    })();
    </script>
</body>
</html>
