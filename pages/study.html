<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study | Lee-seungmihn</title>
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/font.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/util.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ── Study Layout ── */
        body { overflow: hidden; height: 100%; }

        .study-wrap {
            display: flex;
            height: 100vh;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.5s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Left panel – topic list */
        .topic-panel {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            overflow-y: auto;
            background: #1e1e1e;
            border-right: 1px solid var(--border-color);
            padding: 24px 0;
            flex-shrink: 0;
        }
        .topic-panel-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .topic-panel-header .cat-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .topic-panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }
        .topic-list { list-style: none; }
        .topic-list li a {
            display: block;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .topic-list li a:hover {
            color: var(--accent-color);
            background: rgba(255,239,192,0.05);
        }
        .topic-list li a.active {
            color: var(--accent-color);
            background: rgba(255,239,192,0.08);
            border-left-color: var(--accent-color);
            font-weight: 600;
        }
        .topic-list li .topic-num {
            display: inline-block;
            width: 22px;
            font-size: 11px;
            color: #555;
            margin-right: 4px;
        }

        /* Right panel – content viewer */
        .content-panel {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 60px;
            background: var(--primary-bg);
        }

        .content-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent-color); }
        .breadcrumb span { margin: 0 6px; }
        .content-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Rendered note content */
        .note-body { line-height: 1.8; font-size: 15px; }
        .note-body .note-section { margin-bottom: 36px; }
        .note-body .note-section + .note-section { border-top: 1px solid var(--border-color); padding-top: 28px; }

        .note-body h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 20px 0 8px;
        }
        .note-body h4 {
            font-size: 15px;
            font-weight: 600;
            color: #c8c8c8;
            margin: 14px 0 6px;
        }
        .note-body p {
            color: var(--text-main);
            margin: 4px 0;
            padding-left: 12px;
        }
        .note-body pre {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-color);
            border-radius: 6px;
            padding: 16px 20px;
            margin: 12px 0;
            overflow-x: auto;
            font-family: 'Consolas', 'D2Coding', monospace;
            font-size: 13px;
            color: #d4d4d4;
            line-height: 1.6;
        }
        .note-body .note-callout {
            background: rgba(255,239,192,0.06);
            border: 1px solid rgba(255,239,192,0.15);
            border-radius: 6px;
            padding: 12px 16px;
            margin: 10px 0;
            color: #c8c0a0;
            font-size: 14px;
        }
        .note-body .note-tip {
            background: rgba(100,180,255,0.06);
            border-left: 3px solid #5599cc;
            padding: 8px 14px;
            margin: 8px 0;
            color: #99c0e0;
            font-size: 14px;
            border-radius: 0 4px 4px 0;
        }

        /* Loading / Empty state */
        .state-msg {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-size: 15px;
        }
        .state-msg i { font-size: 40px; display: block; margin-bottom: 16px; opacity: 0.4; }

        /* Mobile */
        @media (max-width: 1199px) {
            .study-wrap { margin-left: 0; }
        }
        @media (max-width: 768px) {
            .topic-panel { width: 200px; min-width: 200px; }
            .content-panel { padding: 24px 20px; }
            .content-header h1 { font-size: 20px; }
            .note-body { font-size: 14px; }
        }
        @media (max-width: 600px) {
            .topic-panel {
                position: fixed;
                top: 0; left: -220px;
                width: 220px;
                z-index: 200;
                transition: left 0.3s ease;
                box-shadow: 4px 0 20px rgba(0,0,0,0.5);
            }
            .topic-panel.open { left: 0; }
            .study-wrap { flex-direction: column; }
            .content-panel { height: 100vh; }
            .topic-toggle {
                display: flex !important;
                position: fixed;
                bottom: 70px;
                right: 20px;
                z-index: 201;
                width: 48px; height: 48px;
                background: var(--accent-color);
                color: var(--primary-bg);
                border: none;
                border-radius: 50%;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            }
        }
        .topic-toggle { display: none; }
    </style>
</head>
<body>

    <!-- Mobile nav toggle (global sidebar) -->
    <i class="fas fa-bars mobile-nav-toggle"></i>

    <!-- Global Sidebar -->
    <header id="sidebar">
        <div class="d-flex flex-column">
            <div class="profile">
                <img src="../assets/images/vertical-shot-light-brown-meerkat-daytime.jpg" alt="" class="img-fluid rounded-circle" style="width: 180px; height: 180px; object-fit: cover; object-position: top;">
                <h1 class="text-light"><a href="../index.html">Lee-seungmihn</a></h1>
                <div class="social-links mt-3 text-center">
                    <a href="https://github.com/Lee-seungmihn" target="_blank" class="github"><i class="fab fa-github"></i></a>
                    <a href="#" class="instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="linkedin"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
            <nav class="nav-menu">
                <div class="nav-indicator"></div>
                <ul>
                    <li><a href="../index.html#hero"><i class="fas fa-home"></i> <span>Home</span></a></li>
                    <li><a href="../index.html#about"><i class="fas fa-user"></i> <span>About</span></a></li>
                    <li><a href="../index.html#resume"><i class="fas fa-file-alt"></i> <span>Resume</span></a></li>
                    <li><a href="materials.html" class="active"><i class="fas fa-book"></i> <span>Materials</span></a></li>
                    <li><a href="../index.html#contact"><i class="fas fa-envelope"></i> <span>Contact</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Study 2-panel layout -->
    <div class="study-wrap">

        <!-- Left: Topic panel -->
        <aside class="topic-panel hide-scrollbar" id="topicPanel">
            <div class="topic-panel-header">
                <div class="cat-icon" id="catIcon"></div>
                <h2 id="catTitle">Loading...</h2>
            </div>
            <ul class="topic-list" id="topicList"></ul>
        </aside>

        <!-- Right: Content panel -->
        <main class="content-panel hide-scrollbar" id="contentPanel">
            <div class="content-header">
                <div class="breadcrumb">
                    <a href="../index.html">Home</a>
                    <span>›</span>
                    <a href="materials.html">Materials</a>
                    <span>›</span>
                    <span id="bcCat">-</span>
                </div>
                <h1 id="contentTitle">토픽을 선택해주세요</h1>
            </div>
            <div class="note-body" id="noteBody">
                <div class="state-msg">
                    <i class="fas fa-hand-point-left"></i>
                    왼쪽에서 학습할 주제를 선택하세요.
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile topic panel toggle -->
    <button class="topic-toggle" id="topicToggle" title="목록 열기">
        <i class="fas fa-list"></i>
    </button>

    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/service.js"></script>
    <script src="../assets/js/event.js"></script>
    <script>
    (() => {
        const params   = new URLSearchParams(location.search);
        const cat      = params.get('cat') || 'java';
        const topicId  = params.get('topic');
        const BASE     = '../assets/data/';

        let manifest = null;
        let catMeta  = null;

        // ── 1. Load manifest ──────────────────────────────────────
        fetch(BASE + 'manifest.json')
            .then(r => r.json())
            .then(data => {
                manifest = data;
                catMeta  = manifest[cat];
                if (!catMeta) { showError('카테고리를 찾을 수 없습니다.'); return; }
                initPanel();
            })
            .catch(() => showError('데이터를 불러올 수 없습니다.'));

        // ── 2. Build topic panel ──────────────────────────────────
        function initPanel() {
            document.title = `${catMeta.title} | Lee-seungmihn`;
            document.getElementById('catIcon').innerHTML = `<i class="${catMeta.icon}" style="color:${catMeta.color}"></i>`;
            document.getElementById('catTitle').textContent = catMeta.title;
            document.getElementById('bcCat').textContent   = catMeta.title;

            if (catMeta.type === 'multi') {
                buildMultiTopics();
            } else {
                buildSingleTopic();
            }
        }

        // Multi-file: one file per topic
        function buildMultiTopics() {
            const ul = document.getElementById('topicList');
            catMeta.topics.forEach((topic, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" data-id="${topic.id}" data-title="${topic.title}">
                    <span class="topic-num">${String(idx + 1).padStart(2, '0')}</span>${topic.title}
                </a>`;
                ul.appendChild(li);
            });

            ul.addEventListener('click', e => {
                const a = e.target.closest('a[data-id]');
                if (!a) return;
                e.preventDefault();
                setActive(a);
                loadMultiFile(a.dataset.id, a.dataset.title);
            });

            // Auto-select first or URL param
            const firstTarget = topicId
                ? ul.querySelector(`a[data-id="${topicId}"]`)
                : ul.querySelector('a');
            if (firstTarget) { setActive(firstTarget); loadMultiFile(firstTarget.dataset.id, firstTarget.dataset.title); }
        }

        function loadMultiFile(id, title) {
            document.getElementById('contentTitle').textContent = title;
            showLoading();
            fetch(`${BASE}java/${id}.txt`)
                .then(r => r.text())
                .then(txt => renderNote(txt))
                .catch(() => showError('파일을 불러올 수 없습니다.'));
        }

        // Single-file: parse sections from one txt, build topic list
        function buildSingleTopic() {
            showLoading();
            fetch(BASE + catMeta.file)
                .then(r => r.text())
                .then(txt => {
                    const sections = splitSections(txt);
                    const ul = document.getElementById('topicList');

                    sections.forEach((sec, idx) => {
                        const heading = extractHeading(sec) || `섹션 ${idx + 1}`;
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="#" data-idx="${idx}" data-title="${escHtml(heading)}">
                            <span class="topic-num">${String(idx + 1).padStart(2, '0')}</span>${escHtml(heading)}
                        </a>`;
                        ul.appendChild(li);
                    });

                    ul.addEventListener('click', e => {
                        const a = e.target.closest('a[data-idx]');
                        if (!a) return;
                        e.preventDefault();
                        setActive(a);
                        document.getElementById('contentTitle').textContent = a.dataset.title;
                        renderNote(sections[+a.dataset.idx]);
                    });

                    // Auto-select first
                    const first = ul.querySelector('a');
                    if (first) {
                        setActive(first);
                        document.getElementById('contentTitle').textContent = first.dataset.title;
                        renderNote(sections[0]);
                    }
                })
                .catch(() => showError('파일을 불러올 수 없습니다.'));
        }

        // ── 3. txt → HTML renderer ────────────────────────────────
        function renderNote(rawText) {
            const lines = rawText.split(/\r?\n/);
            let html = '';
            let codeLines = [];
            let inCode = false;

            const flushCode = () => {
                if (codeLines.length) {
                    html += `<pre>${escHtml(codeLines.join('\n'))}</pre>`;
                    codeLines = [];
                }
                inCode = false;
            };

            for (let i = 0; i < lines.length; i++) {
                const raw = lines[i];
                const trimmed = raw.trim();

                // separator line
                if (/^[-=]{5,}\s*$/.test(trimmed)) {
                    flushCode();
                    continue;
                }

                // empty line
                if (!trimmed) {
                    flushCode();
                    html += '';
                    continue;
                }

                // Detect indent level
                const leadingTabs  = (raw.match(/^\t+/) || [''])[0].length;
                const leadingSpaces= (raw.match(/^ +/)  || [''])[0].length;
                const indent = leadingTabs || Math.floor(leadingSpaces / 3);

                // Code detection heuristic
                const isCodeLine = /[{};]$/.test(trimmed)
                    || /^\s*(public|private|protected|class|void|int|String|return|if|else|for|while|import|package|new |System\.|\/\/|\*|@)/.test(raw)
                    || /[{}();]/.test(trimmed) && indent >= 2;

                if (isCodeLine) {
                    inCode = true;
                    codeLines.push(raw.replace(/\t/g, '    '));
                    continue;
                }

                flushCode();

                // ▶ callout
                if (trimmed.startsWith('▶')) {
                    html += `<div class="note-callout"><strong>${escHtml(trimmed)}</strong></div>`;
                    continue;
                }

                // ※ tip
                if (trimmed.startsWith('※')) {
                    html += `<div class="note-tip">${escHtml(trimmed)}</div>`;
                    continue;
                }

                // Heading: no indent, not too long, doesn't look like a sentence
                if (indent === 0 && trimmed.length < 60 && !trimmed.endsWith('.')) {
                    html += `<h3>${escHtml(trimmed)}</h3>`;
                    continue;
                }

                // Sub-heading: indent 1, short
                if (indent === 1 && trimmed.length < 50 && /^\d+\./.test(trimmed)) {
                    html += `<h4>${escHtml(trimmed)}</h4>`;
                    continue;
                }

                // Body paragraph
                html += `<p>${escHtml(trimmed)}</p>`;
            }

            flushCode();
            document.getElementById('noteBody').innerHTML = html || '<p style="color:var(--text-muted)">내용이 없습니다.</p>';
            document.getElementById('contentPanel').scrollTop = 0;
        }

        // ── 4. Helpers ────────────────────────────────────────────
        function splitSections(txt) {
            return txt.split(/\n[-=]{5,}\s*\n/).map(s => s.trim()).filter(Boolean);
        }

        function extractHeading(section) {
            const lines = section.split(/\r?\n/);
            for (const l of lines) {
                const t = l.trim();
                if (t && !/^[-=]/.test(t)) return t.substring(0, 40);
            }
            return null;
        }

        function setActive(el) {
            document.querySelectorAll('.topic-list a').forEach(a => a.classList.remove('active'));
            el.classList.add('active');
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function showLoading() {
            document.getElementById('noteBody').innerHTML =
                '<div class="state-msg"><i class="fas fa-spinner fa-spin"></i>불러오는 중...</div>';
        }

        function showError(msg) {
            document.getElementById('noteBody').innerHTML =
                `<div class="state-msg"><i class="fas fa-exclamation-triangle"></i>${msg}</div>`;
        }

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // Mobile topic panel toggle
        const toggleBtn = document.getElementById('topicToggle');
        const panel     = document.getElementById('topicPanel');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('open');
            });
            document.getElementById('contentPanel').addEventListener('click', () => {
                panel.classList.remove('open');
            });
        }
    })();
    </script>
</body>
</html>
